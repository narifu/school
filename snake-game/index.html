<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <title>贪吃蛇 · Snake</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307101c'/%3E%3Cpath d='M14 42h14V30h12v12h10' stroke='%233ce08d' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='47' cy='22' r='6' fill='%23ff6377'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1 class="brand-title">
            贪吃蛇 <span class="brand-sub">SNAKE</span>
          </h1>
        </div>
        <div class="scores">
          <div class="score">
            <span class="score-label">得分</span>
            <strong id="score-value" class="score-value">0</strong>
          </div>
          <div class="score score-best">
            <span class="score-label">最高分</span>
            <strong id="best-value" class="score-value">0</strong>
          </div>
        </div>
      </header>

      <section class="board-card" aria-label="游戏区域">
        <div id="board" class="board">
          <canvas
            id="game-canvas"
            width="480"
            height="480"
            role="img"
            aria-label="贪吃蛇游戏棋盘，使用方向键或滑动控制蛇的方向"
          ></canvas>

          <div id="overlay" class="overlay" hidden>
            <p id="overlay-kicker" class="overlay-kicker">准备好了吗？</p>
            <h2 id="overlay-title" class="overlay-title">贪吃蛇</h2>
            <p id="overlay-message" class="overlay-message">
              方向键 / WASD 控制方向，空格暂停
            </p>
            <div class="overlay-actions">
              <button id="start-btn" type="button" class="btn btn-primary">
                开始游戏
              </button>
              <button id="restart-btn" type="button" class="btn btn-primary" hidden>
                再来一局
              </button>
            </div>
          </div>
        </div>
        <p id="status" class="sr-only" aria-live="polite">准备开始</p>
      </section>

      <section class="controls" aria-label="操作提示">
        <div class="hud">
          <button id="pause-btn" type="button" class="btn btn-ghost" disabled>
            暂停
          </button>
          <p class="hint">
            按 <kbd>空格</kbd> 暂停 / 继续 · <kbd>Enter</kbd> 开始或重开
          </p>
        </div>

        <div id="dpad" class="dpad" aria-label="方向控制">
          <button type="button" class="dpad-btn dpad-up" data-dir="up" aria-label="向上">
            ▲
          </button>
          <button type="button" class="dpad-btn dpad-left" data-dir="left" aria-label="向左">
            ◀
          </button>
          <button type="button" class="dpad-btn dpad-down" data-dir="down" aria-label="向下">
            ▼
          </button>
          <button type="button" class="dpad-btn dpad-right" data-dir="right" aria-label="向右">
            ▶
          </button>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
    <script src="main.js"></script>
  </body>
</html>
